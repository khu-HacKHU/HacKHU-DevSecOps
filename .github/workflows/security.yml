name: Security

# HacKHU-HP의 security.yml에서 gitleaks 잡만 가져왔다. 10/8 실습 PR에도 같은 관문을 건다.
#
# Semgrep·CodeQL·Checkov는 넣지 않는다. 이 저장소에는 분석할 앱 코드가 없다.

on:
  pull_request:
    branches: [main, develop, 'release/**']
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # PR은 추가된 커밋만, push는 전체 히스토리를 본다.
      - name: 시크릿 스캔
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          args=(git --redact --verbose --config .gitleaks.toml)
          if [ -n "$BASE_SHA" ]; then
            args+=(--log-opts="$BASE_SHA..$HEAD_SHA")
          fi
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 "${args[@]}" .
