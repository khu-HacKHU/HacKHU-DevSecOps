name: 작업
description: 새로 할 일. 담당자를 정해 할당한다.
title: "feat: "
body:
  - type: markdown
    attributes:
      value: |
        제목은 커밋과 같은 `type: 한글 설명` 형식으로 쓴다 (`feat` `fix` `docs` `design` `cicd` `refactor` `test` `chore` `security`).
        브랜치는 `{type}/{이슈번호}-{slug}`로 만든다. 예: `docs/12-git-cheatsheet`
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 무엇을, 왜 하는가
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 이것이 되면 이슈를 닫는다
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: 참고
      description: 관련 이슈, 문서, 결정 사항
